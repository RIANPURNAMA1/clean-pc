name: Build CleanPC (Windows)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint, typecheck, format
        run: |
          npm run lint
          npm run typecheck
          npm run format:check

      - name: Rust tests (di Windows asli: symlink/reparse, path, cleaner)
        run: cargo test -p cleanpc-core

      - name: Build installer (NSIS + MSI)
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: CleanPC-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
