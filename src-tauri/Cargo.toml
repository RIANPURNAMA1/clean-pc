[package]
name = "cleanpc"
version = "0.1.0"
description = "CleanPC - pembersih cache dan file sementara untuk Windows"
edition = "2021"

[lib]
name = "cleanpc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
cleanpc-core = { path = "../crates/cleanpc-core" }
